<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="renext-grad-1" x1="15" y1="10" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0038A8" />
    </linearGradient>
    <linearGradient id="renext-grad-2" x1="45" y1="10" x2="85" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="renext-grad-3" x1="40" y1="45" x2="85" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F4C81" />
    </linearGradient>
  </defs>
  <!-- Stylized Geometric 3D R Monogram -->
  <g transform="translate(10, 5)">
