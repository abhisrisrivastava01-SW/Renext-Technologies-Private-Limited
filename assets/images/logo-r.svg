  </g>
  <!-- Brand Name Typography -->
  <text x="115" y="48" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="900" font-size="34" fill="#0F172A" letter-spacing="1">RENEXT</text>
  <text x="115" y="74" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="700" font-size="14" fill="#1E3A8A" letter-spacing="3">TECHNOLOGIES PVT LTD</text>
</svg>
